[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-msa"
version = "0.1.1"
description = "CuTeDSL Flash-MSA training kernels for sparse attention."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Flash-MSA contributors" }
]
keywords = ["attention", "cuda", "cutedsl", "pytorch", "sparse-attention"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "cuda-python",
  "nvidia-cutlass-dsl[cu13]==4.5.2",
  "packaging",
  "torch>=2.11",
  "ninja",
]

[project.optional-dependencies]
fa4 = [
  "flash-attn-4[cu13] @ git+https://github.com/Dao-AILab/flash-attention.git@6a94f8b906cf5ab944385d64707f9387f3dd6be9#subdirectory=flash_attn/cute",
]
dev = [
  "numpy",
  "psutil",
  "pytest",
  "wheel",
]

[tool.setuptools.packages.find]
include = ["flash_msa*"]

[tool.setuptools.package-data]
flash_msa = ["csrc/*.cu"]
